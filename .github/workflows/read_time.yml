name: read time sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      BOOK_DATABASE_NAME: ${{ vars.BOOK_DATABASE_NAME }}
      AUTHOR_DATABASE_NAME: ${{ vars.AUTHOR_DATABASE_NAME }}
      CATEGORY_DATABASE_NAME: ${{ vars.CATEGORY_DATABASE_NAME }}
      BOOKMARK_DATABASE_NAME: ${{ vars.BOOKMARK_DATABASE_NAME }}
      REVIEW_DATABASE_NAME: ${{ vars.REVIEW_DATABASE_NAME }}
      CHAPTER_DATABASE_NAME: ${{ vars.CHAPTER_DATABASE_NAME }}
      YEAR_DATABASE_NAME: ${{ vars.YEAR_DATABASE_NAME }}
      WEEK_DATABASE_NAME: ${{ vars.WEEK_DATABASE_NAME }}
      MONTH_DATABASE_NAME: ${{ vars.MONTH_DATABASE_NAME }}
      DAY_DATABASE_NAME: ${{ vars.DAY_DATABASE_NAME }}
      REF: ${{ github.ref }}
      REPOSITORY: ${{ github.repository }}
      YEAR: ${{ vars.YEAR }}
      HEATMAP_NAME: ${{ secrets.NAME }}
      HEATMAP_BACKGROUND_COLOR: ${{ vars.background_color || '#FFFFFF' }}
      HEATMAP_TRACK_COLOR: ${{ vars.track_color || '#ACE7AE' }}
      HEATMAP_SPECIAL_COLOR1: ${{ vars.special_color || '#69C16E' }}
      HEATMAP_SPECIAL_COLOR2: ${{ vars.special_color2 || '#549F57' }}
      HEATMAP_EMPTY_COLOR: ${{ vars.dom_color || '#EBEDF0' }}
      HEATMAP_TEXT_COLOR: ${{ vars.text_color || '#000000' }}
      WEREAD_READ_TIMES_FILE: /tmp/weread-read-times.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Remove old heatmap
        run: rm -rf ./OUT_FOLDER
      - name: Set default year if not provided
        run: echo "YEAR=$(date +%Y)" >> "$GITHUB_ENV"
        if: env.YEAR == ''
      - name: Generate WeRead heatmap
        run: python -m weread2notionpro.heatmap
      - name: Rename heatmap
        run: |
          RANDOM_FILENAME=$(uuidgen).svg
          mv ./OUT_FOLDER/weread.svg ./OUT_FOLDER/$RANDOM_FILENAME
          echo "Renamed file to $RANDOM_FILENAME"
      - name: Push heatmap
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add OUT_FOLDER
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m 'add new heatmap'
            git push
          fi
      - name: Sync reading time to Notion
        run: python -m weread2notionpro.read_time
